<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}">
<meta charset="UTF-8">
<title>ユーザ登録画面</title>
</head>

<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h3 mb-4 text-center">ユーザ登録を行ってください</h2>

          <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

          <form th:action="@{/signup}" method="post" th:object="${signupForm}">
            <div class="mb-3">
              <label for="loginId" class="form-label">ログインID</label>
              <input id="loginId" class="form-control" type="text" th:field="*{loginId}">
              <div class="text-danger mt-2" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">パスワード</label>
              <input id="password" class="form-control" type="password" th:field="*{password}">
            </div>

            <button type="submit" class="btn btn-primary w-100">ユーザ登録</button>
          </form>

          <div class="mt-3 text-center">
            <a class="btn btn-link" th:href="@{/login}">▶ログイン画面へ戻る</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>

</html>
