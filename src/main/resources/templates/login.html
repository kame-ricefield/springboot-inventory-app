<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}">
<meta charset="UTF-8">
<title>ログイン画面</title>
</head>

<body>
<div class="container-fluid">
 <h2>ログインして下さい</h2>
 <span th:text="${errorMsg}"></span>
 <form th:action="@{/login}" method="post" th:object="${loginForm}">
   <div class="form-group">
     <div class="col-2">
      <p><label>ログインID</label>
      <input class="form-control" type="text" th:field="*{loginId}">
      <p><label>パスワード</label>
      <input class="form-control" type="password" th:field="*{password}">
     </div>
   <p><input class="btn btn-primary" type="submit" value="ログインする">
   </div>
 </form>
</div>
</body>

</html>
