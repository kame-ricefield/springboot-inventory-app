<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>在庫管理</title>
</head>

<body>
	<div th:insert="common/sourcelist :: sourcelist"></div>
	<div th:replace="common/header :: header"></div>
<h2>在庫更新</h2>

<!-- メッセージ表示 -->
<p th:if="${message != null}" th:text="${message}"></p>
<p th:if="${inventoryUpdateDisabled != null && inventoryUpdateDisabled == true}">
    このアカウントでは在庫更新は実行できません。
</p>

<!-- 入力フォーム -->
<form th:if="${inventoryUpdateDisabled == null || inventoryUpdateDisabled == false}" th:action="@{/inventory/update}" method="post" onsubmit="return confirm('本当に更新してもよろしいですか？');">
    <div class="inventory-update-field">
        <label for="productName">商品選択</label>
        <select id="productName" name="productName" required>
            <option value="" disabled selected>商品を選択してください</option>
            <option th:each="p : ${products}" th:value="${p.productName}" th:text="${p.productName}"></option>
        </select>
    </div>

    <div class="inventory-update-field">
        <label for="quantity">数量更新</label>
        <input id="quantity" type="number" name="quantity" required />
    </div>

    <div class="inventory-update-action">
        <button type="submit">更新</button>
    </div>
</form>

<hr>

<h2>在庫一覧</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>商品名</th>
        <th>在庫数</th>
    </tr>

    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.productName}"></td>
        <td th:text="${p.quantity}"></td>
    </tr>
</table>

</body>
</html>
