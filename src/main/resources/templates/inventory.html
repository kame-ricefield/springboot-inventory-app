<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>在庫管理</title>
</head>

<body class="bg-light">
    <div th:insert="common/sourcelist :: sourcelist"></div>
    <div th:replace="common/header :: header"></div>

    <div class="container my-4">
        <div sec:authorize="hasRole('ADMIN')" class="mb-3">
            <a class="btn btn-outline-primary" th:href="@{/signup}">▶ユーザ登録はコチラ</a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">在庫更新</h2>

                <p class="text-danger mb-2" th:if="${message != null}" th:text="${message}"></p>
                <p class="text-warning mb-3" th:if="${inventoryUpdateDisabled != null && inventoryUpdateDisabled == true}">
                    このアカウントでは在庫更新は実行できません。
                </p>

                <form th:if="${inventoryUpdateDisabled == null || inventoryUpdateDisabled == false}" th:action="@{/inventory/update}" method="post" onsubmit="return confirm('本当に更新してもよろしいですか？');" class="row g-3 align-items-end">
                    <input type="hidden" name="keyword" th:value="${keyword}" />
                    <div class="col-md-5">
                        <label for="productName" class="form-label">商品選択</label>
                        <select id="productName" name="productName" class="form-select" required>
                            <option value="" disabled selected>商品を選択してください</option>
                            <option th:each="p : ${products}" th:value="${p.productName}" th:text="${p.productName}"></option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="quantity" class="form-label">数量更新</label>
                        <input id="quantity" type="number" name="quantity" class="form-control" required />
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">更新</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">在庫一覧</h2>

                <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
                    <form class="d-flex align-items-end gap-2 flex-wrap" th:action="@{/inventory}" method="get">
                        <div>
                            <label for="keyword" class="form-label">商品名検索</label>
                            <input id="keyword" type="search" name="keyword" th:value="${keyword}" class="form-control" />
                        </div>
                        <button type="submit" class="btn btn-outline-secondary">検索</button>
                    </form>

                    <form th:action="@{/inventory/export}" method="post">
                        <input type="hidden" name="keyword" th:value="${keyword}" />
                        <button type="submit" class="btn btn-success">CSVダウンロード</button>
                    </form>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>商品名</th>
                                <th>在庫数</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.productName}"></td>
                                <td th:text="${p.quantity}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
